<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O circuito · Tênis em números</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/estilo.css?v=2">
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<script src="assets/site.js?v=3"></script>
<script src="assets/comum.js?v=3"></script>

<script src="assets/descritiva.js?v=2"></script>
</head>
<body>
<header class="topo"><div id="quadra"></div><div class="topo-dentro">
  <span class="etiqueta">Visão geral · O circuito</span>
  <h1>O circuito em números</h1>
  <p>Todas as partidas do circuito principal da ATP concluídas entre 2000 e 2025: superfícies, duração, aces,
    ranking e muito mais. Use os filtros para recortar por superfície, nível do torneio, anos ou jogadores do Top N.</p>
</div></header>
<main class="conteudo">
  <div id="filtros"></div>
  <div id="placar"></div>
  <div id="painel"></div>
</main>
<script>
document.getElementById("quadra").innerHTML = svgQuadra();
(async () => {
  const [meta, pop] = await Promise.all([carregar("meta"), carregar("populacao")]);
  const raiz = document.getElementById("painel");
  raiz.innerHTML = htmlPainel();
  ligarAbas(raiz);
  const f = estadoFiltros(meta, [2000, 2025]);
  const desenhar = () => {
    const idx = aplicarFiltros(pop, f);
    placarFiltrado(document.getElementById("placar"), pop, idx);
    if (!idx.length) { raiz.querySelector("#quali").innerHTML = "<p>Nenhuma partida com esses filtros.</p>"; return; }
    painelDescritivo(raiz, meta, { nome: "População", cor: CORES.pop, d: pop, idx }, null);
  };
  montarFiltros(document.getElementById("filtros"), meta, f, desenhar);
  desenhar();
})();
</script>
</body>
</html>
